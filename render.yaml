# Render Blueprint – Render sam postavlja server prema ovoj datoteci.
services:
  - type: web
    name: nomad-kartica
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    disk:
      name: nomad-podaci
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PIN
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_SSID
        value: ASUS - NOMAd
