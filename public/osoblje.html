<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<meta name="robots" content="noindex">
<title>NOMAd – osoblje</title>
<link rel="icon" href="/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats div{background:#000;border:1px solid var(--line);border-radius:14px;padding:12px}
  .stats b{display:block;font-family:var(--display);font-size:28px;color:var(--gold-hi)}
  .ok{color:var(--ok);font-size:15px;font-weight:600;min-height:18px}
  .row2{display:flex;gap:8px} .row2 .field{flex:1;min-width:0} .row2 .field input{width:100%} .row2 .btn{flex-shrink:0}
</style>
</head>
<body>
<div class="wrap" style="padding-bottom:40px">
  <div class="brand"><img src="/logo-192.png" alt="NOMAd Caffe Bar logo"><div><div class="name">NOMAd</div><div class="sub">Osoblje</div></div></div>

  <section id="aLogin" style="display:flex;flex-direction:column;gap:12px">
    <form id="fAdmin" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="aPin">PIN osoblja</label><input id="aPin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
      <div class="err" id="aErr" role="alert"></div>
      <button class="btn" type="submit">Prijava</button>
    </form>
  </section>

  <section id="aMain" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="box">
      <div class="label">Potvrdi nagradu</div>
      <div id="reader" class="hidden" style="border-radius:14px;overflow:hidden"></div>
      <button class="btn ghost" id="btnCam" type="button">Skeniraj kod gosta kamerom</button>
      <form id="fRedeem" class="row2" style="align-items:flex-end">
        <div class="field"><label for="code">Ili upiši kod</label><input id="code" placeholder="NMD-XXXX-XXXX" autocapitalize="characters" required></div>
        <button class="btn" style="width:auto;padding:0 18px;height:52px" type="submit">Potvrdi</button>
      </form>
      <div class="ok" id="redeemOk" role="status"></div><div class="err" id="redeemErr" role="alert"></div>
    </div>

    <div class="box">
      <div class="label">Bodovi gostu (ručno)</div>
      <form id="fFind" class="row2" style="align-items:flex-end">
        <div class="field"><label for="q">Broj kartice ili mobitela</label><input id="q" required></div>
        <button class="btn ghost" style="width:auto;padding:0 16px;height:52px" type="submit">Traži</button>
      </form>
      <div id="guest" class="hidden" style="display:flex;flex-direction:column;gap:10px">
        <div class="kv"><span id="gName"></span><b><span id="gPts"></span> bodova · br. <span id="gNo"></span></b></div>
        <form id="fPts" class="row2" style="align-items:flex-end">
          <div class="field" style="max-width:110px"><label for="pts">Bodovi</label><input id="pts" type="number" value="10" min="-100" max="100" required></div>
          <div class="field"><label for="note">Napomena</label><input id="note" placeholder="npr. račun nije imao QR kod"></div>
        </form>
        <button class="btn" id="btnPts" type="button">Dodaj bodove</button>
      </div>
      <div class="ok" id="ptsOk" role="status"></div><div class="err" id="ptsErr" role="alert"></div>
    </div>

    <div class="box">
      <div class="label">Statistika</div>
      <div class="stats">
        <div><b id="sGuests">–</b><span class="small">gostiju s karticom</span></div>
        <div><b id="sToday">–</b><span class="small">računa danas</span></div>
        <div><b id="sTotal">–</b><span class="small">računa ukupno</span></div>
        <div><b id="sRedeemed">–</b><span class="small">iskorištenih nagrada</span></div>
      </div>
    </div>
    <button class="btn ghost" id="btnOut" type="button">Odjava</button>
  </section>
</div>
<script src="/vendor/html5-qrcode.min.js"></script>
<script src="/osoblje.js"></script>
</body>
</html>
